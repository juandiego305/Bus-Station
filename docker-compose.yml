services:
  # --- Infraestructura ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transporte
      POSTGRES_PASSWORD: transporte
      POSTGRES_DB: transporte_vivo
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transporte -d transporte_vivo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Servicios (uno por consumidor del flujo, ver docs/flujo-transporte.md) ---
  gateway-ingesta:
    build:
      context: .
      dockerfile: services/gateway-ingesta/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["3001:3001"]
    environment:
      KAFKA_BROKERS: kafka:9092
      PUERTO: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tiempo-real:
    build:
      context: .
      dockerfile: services/tiempo-real/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3002:3002"]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PUERTO: 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  estimador-llegadas:
    build:
      context: .
      dockerfile: services/estimador-llegadas/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3003:3003"]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PUERTO: 3003
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  alertas:
    build:
      context: .
      dockerfile: services/alertas/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3004:3004"]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PUERTO: 3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  historico:
    build:
      context: .
      dockerfile: services/historico/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://transporte:transporte@postgres:5432/transporte_vivo
    healthcheck:
      test: ["CMD", "node", "-e", "const { Client } = require('pg'); const client = new Client({ connectionString: process.env.DATABASE_URL }); client.connect().then(() => client.end()).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  reportes:
    build:
      context: .
      dockerfile: services/reportes/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3006:3006"]
    environment:
      DATABASE_URL: postgres://transporte:transporte@postgres:5432/transporte_vivo
      PUERTO: 3006
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-publica:
    build:
      context: .
      dockerfile: services/api-publica/Dockerfile
    depends_on:
      tiempo-real:
        condition: service_healthy
    ports: ["3005:3005"]
    environment:
      TIEMPO_REAL_URL: http://tiempo-real:3002
      PUERTO: 3005
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
